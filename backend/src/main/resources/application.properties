server.port=8080

# H2 in-memory database (dev)
spring.datasource.url=jdbc:h2:mem:smartcampusdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Google OAuth2 - replace with your credentials from Google Cloud Console
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=email,profile

# JWT
app.jwt.secret=3f8b2c7d1a4e6f9012345678901234567890abcdef1234567890abcdef123456
app.jwt.expiration-ms=86400000

# Frontend URL (for OAuth2 redirect)
app.frontend-url=http://localhost:5173

# CORS
app.cors.allowed-origins=http://localhost:5173
