server.port=8080

# Activate the local profile so application-local.properties (gitignored)
# can override secrets like database password and OAuth credentials.
spring.profiles.active=local

# --- MySQL (MySQL Workbench connection: "smart campus") ---
spring.datasource.url=jdbc:mysql://localhost:3306/smartcampus_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
# spring.datasource.password is set in application-local.properties

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Google OAuth2 — client-id and client-secret are set in application-local.properties
spring.security.oauth2.client.registration.google.scope=email,profile

# JWT
app.jwt.secret=3f8b2c7d1a4e6f9012345678901234567890abcdef1234567890abcdef123456
app.jwt.expiration-ms=86400000

# Frontend URL (for OAuth2 redirect)
app.frontend-url=http://localhost:5173

# CORS
app.cors.allowed-origins=http://localhost:5173

# Default admin seed (only used once, on first startup if no admin exists in DB)
app.admin.email=admin@smartcampus.com
app.admin.password=admin123
app.admin.name=Admin

# Multipart file uploads (Module C ticket attachments)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
