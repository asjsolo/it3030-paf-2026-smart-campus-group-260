server.port=8080

# H2 in-memory database (dev) — switch to MySQL block below when ready for persistence
spring.datasource.url=jdbc:h2:mem:smartcampusdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- MySQL alternative (XAMPP) — uncomment to use, and comment H2 block above ---
# spring.datasource.url=jdbc:mysql://localhost:3306/smartcampus_db?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=

# Google OAuth2 - replace with your credentials from Google Cloud Console
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=email,profile

# JWT
app.jwt.secret=3f8b2c7d1a4e6f9012345678901234567890abcdef1234567890abcdef123456
app.jwt.expiration-ms=86400000

# Frontend URL (for OAuth2 redirect)
app.frontend-url=http://localhost:5173

# CORS
app.cors.allowed-origins=http://localhost:5173

# Default admin seed (only used once, on first startup if no admin exists in DB)
app.admin.email=admin@smartcampus.com
app.admin.password=admin123
app.admin.name=Admin

# Multipart file uploads (Module C ticket attachments)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
